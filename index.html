<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 // LFREEBOTE NOT FOUND</title>

<style>
:root{
    --bg:#0a0a0f;
    --panel:#111116;
    --border:#333344;
    --text:#e6e6ff;
    --dim:#7a7a96;
    --red:#ff0055;
    --green:#00ffaa;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Consolas,Monaco,monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:680px;
    background:var(--panel);
    border:1px solid var(--border);
    padding:40px;
    text-align:center;
    box-shadow:0 0 30px rgba(255,0,85,.15);
}

h1{
    font-size:90px;
    color:var(--red);
    letter-spacing:10px;
    line-height:1;
    margin-bottom:10px;
}

h2{
    font-size:20px;
    letter-spacing:4px;
    font-weight:400;
    margin-bottom:30px;
}

.msg{
    color:var(--dim);
    line-height:1.8;
    margin-bottom:25px;
}

.path{
    margin:20px 0;
    padding:12px;
    border:1px solid var(--border);
    background:#0d0d12;
    color:var(--green);
    word-break:break-all;
}

.buttons{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:25px;
}

.btn{
    border:1px solid var(--green);
    color:var(--green);
    text-decoration:none;
    padding:12px 22px;
    transition:.2s;
}

.btn:hover{
    background:var(--green);
    color:#000;
}

.code{
    margin-top:35px;
    color:#505060;
    font-size:11px;
    line-height:1.7;
}

.blink{
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{opacity:.3;}
}
</style>
</head>
<body>

<div class="box">

    <h1>404</h1>

    <h2>LFREEBOTE // NOT FOUND</h2>

    <div class="msg">
        SCSI // RAID // ORT tmpOMG<br>
        Die angeforderte Stelle ist nicht im 81→729 Grid.<br>
        MARKIERT, aber kein ALLOC.
    </div>

    <div class="path" id="path">
        SCANNING...
    </div>

    <div class="buttons">
        <a class="btn" href="/">ROOT</a>
        <a class="btn" href="#" id="backBtn">CALL BACK COME</a>
    </div>

    <div class="code">
        BIOS=0 | ORDNUNG.tmp.ready | RAM=729 | ARBEIT=WAN<br>
        lfreebote / allcall recall os<br>
        NODE=<span class="blink">UNKNOWN</span>
    </div>

</div>

<script>

document.getElementById("path").textContent =
"REQUESTED NODE: " + window.location.pathname;

document.getElementById("backBtn").addEventListener("click",function(e){

    e.preventDefault();

    if(history.length > 1){
        history.back();
    }else{
        window.location.href="/";
    }

});

console.log("ROOT READY");
console.log("GRID 81 -> 729");
console.log("ALLOC FALSE");

</script>

</body>
</html>
