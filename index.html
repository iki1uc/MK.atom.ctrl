// vorher: 4 files separat -> jetzt: 1 essein file

import { Vec3, clamp } from '../core/vec.js';
import { HOME } from '../core/essein.js';

export const NC = {
  space: (v) => new Vec3(clamp(v.x,0,HOME), clamp(v.y,0,81), v.z),
  time: (clock) => clock.t / 1000, // sec
  kraft: (a,b,k=0.1) => Vec3.sub(b,a).scale(k),
  figur: (pos, target) => {
    // figur = ort + ausrichtung
    return { pos, dir: Vec3.normalize(Vec3.sub(target,pos)) };
  },
  unified(pos, target, dt){
    const s = this.space(pos);
    const k = this.kraft(s,target);
    const f = this.figur(s,target);
    return { ...f, kraft: k, zeit: dt };
  }
};`,"rom.js":`// HDF-ROM: Key-Value pro Buchstabe, localStorage, ehrlich kein DB
export const ROM = {
  _ns: (buchstabe) => \`HDF:\${buchstabe.toUpperCase()}:\`,
  set: (b, key, val) => {
    localStorage.setItem(ROM._ns(b)+key, JSON.stringify(val));
  },
  get: (b, key) => {
    const raw = localStorage.getItem(ROM._ns(b)+key);
    return raw ? JSON.parse(raw) : null;
  },
  clear: (b) => {
    const p = ROM._ns(b);
    Object.keys(localStorage).forEach(k=>{
      if(k.startsWith(p)) localStorage.removeItem(k);
    });
  }
